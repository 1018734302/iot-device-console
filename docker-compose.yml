name: iot-phone-demo

services:
  emqx:
    image: emqx/emqx:5.8.6
    container_name: iot-emqx
    ports:
      - "1883:1883"     # MQTT，局域网内设备与本机服务使用
      - "8083:8083"     # MQTT over WebSocket，测试网页的模拟设备使用
      - "18083:18083"   # Dashboard，默认账号 admin / public
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    restart: unless-stopped

volumes:
  emqx-data:
  emqx-log:
